[project]
name = "my-capstone"
version = "0.1.0"
description = "A source-grounded research assistant: cites its sources, refuses what they do not support."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # The Dev3Pack course package: the grader, `capstone grade` and `capstone submit`.
  # It follows the cohort's main branch, and uv.lock records the exact commit you
  # run, which is what `capstone submit` reports. To move to a newer course:
  #   uv lock --upgrade-package dev3pack-bootcamp-ai-engineering && uv sync
  # then commit uv.lock. Nothing changes until you run that.
  "dev3pack-bootcamp-ai-engineering @ git+https://github.com/Gecko-Academy/dev3pack-cohort-2026-09",
]

[project.optional-dependencies]
# A real model behind the seam. `uv sync --extra anthropic`, then set
# BOOTCAMP_PROVIDER and the key in .env (never in a committed file).
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.uv]
# An application, not a library: nothing here is built or published.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# The course, checked out by CI (and by you, locally) to run the grader.
extend-exclude = [".course"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
