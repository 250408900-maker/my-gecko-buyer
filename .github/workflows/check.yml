name: check

# Every push: the key scan, lint, the offline tests, and the recorded cases as a report.
# No secret is read anywhere: nothing here signs, and the recorded lane needs no network.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      # First, before anything installs: a key in the repository fails the push.
      - run: python3 scripts/scan_secrets.py
      - run: uv sync
      - run: uv run ruff check .
      # Green on day one: what you have not written yet is xfail, and turns into a real
      # test as soon as you write it.
      - run: uv run pytest

  recorded-cases:
    # A report, not a gate: it shows how many of the five cases and the trap already end
    # the way their fixtures expect. It starts at 0/6 and that is the starting line.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GECKO_SOURCE: recorded
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync
      - name: the five cases and the trap, offline
        continue-on-error: true
        run: |
          set +e
          uv run buyer --cases | tee cases.txt
          status=${PIPESTATUS[0]}
          {
            echo "### Recorded cases (offline, no key)"
            echo
            echo '```'
            tail -n 1 cases.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
